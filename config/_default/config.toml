# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://poolp.org"

# Replaces the per-template `| emojify` calls that used to live in our
# layout overrides -- Hugo now renders :shortcodes: site-wide.
enableEmoji = true
defaultContentLanguage = "en"
languageCode = "en-US"
languageName = "English"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 25

buildDrafts = false
buildFuture = false

# googleAnalytics = "G-XXXXXXXXX"

[permalinks]
  posts = "/posts/:year-:month-:day/:slug"

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

# replaces `paginate = 10`, a key Hugo removed in v0.128 -- it had been
# silently ignored ever since, so this just makes the existing behaviour
# (Hugo's default of 10) explicit again
[pagination]
  pagerSize = 10
